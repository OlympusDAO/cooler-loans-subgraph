"""
Aggregated default statistics
"""
type DefaultStats
  @aggregation(intervals: ["hour", "day"], source: "ClaimDefaultedLoanEvent") {
  id: Int8!
  timestamp: Timestamp!
  clearinghouse: BigInt!
    @aggregate(fn: "count", field: "clearinghouseSnapshot.clearinghouse")

  # Count of defaults
  defaultCount: Int! @aggregate(fn: "count")

  # Collateral amounts
  totalCollateralClaimed: BigDecimal!
    @aggregate(fn: "sum", arg: "collateralQuantityClaimed")
  minCollateralClaimed: BigDecimal!
    @aggregate(fn: "min", arg: "collateralQuantityClaimed")
  maxCollateralClaimed: BigDecimal!
    @aggregate(fn: "max", arg: "collateralQuantityClaimed")

  # Value amounts
  totalValueClaimed: BigDecimal!
    @aggregate(fn: "sum", arg: "collateralValueClaimed")
  minValueClaimed: BigDecimal!
    @aggregate(fn: "min", arg: "collateralValueClaimed")
  maxValueClaimed: BigDecimal!
    @aggregate(fn: "max", arg: "collateralValueClaimed")

  # Principal amounts
  totalPrincipalDefaulted: BigDecimal!
    @aggregate(fn: "sum", arg: "defaultedPrincipal")
  minPrincipalDefaulted: BigDecimal!
    @aggregate(fn: "min", arg: "defaultedPrincipal")
  maxPrincipalDefaulted: BigDecimal!
    @aggregate(fn: "max", arg: "defaultedPrincipal")

  # Price metrics
  maxCollateralPrice: BigDecimal! @aggregate(fn: "max", arg: "collateralPrice")
  minCollateralPrice: BigDecimal! @aggregate(fn: "min", arg: "collateralPrice")
  firstCollateralPrice: BigDecimal!
    @aggregate(fn: "first", arg: "collateralPrice")
  lastCollateralPrice: BigDecimal!
    @aggregate(fn: "last", arg: "collateralPrice")

  # Time metrics
  maxSecondsSinceExpiry: BigInt!
    @aggregate(fn: "max", arg: "secondsSinceExpiry")
  minSecondsSinceExpiry: BigInt!
    @aggregate(fn: "min", arg: "secondsSinceExpiry")
}

"""
Aggregated repayment statistics
"""
type RepaymentStats
  @aggregation(intervals: ["hour", "day"], source: "RepayLoanEvent") {
  id: Int8!
  timestamp: Timestamp!
  clearinghouse: BigInt!
    @aggregate(fn: "count", field: "clearinghouseSnapshot.clearinghouse")

  # Count of repayments
  repaymentCount: Int! @aggregate(fn: "count")

  # Total amount metrics
  totalAmountPaid: BigDecimal! @aggregate(fn: "sum", arg: "amountPaid")
  minAmountPaid: BigDecimal! @aggregate(fn: "min", arg: "amountPaid")
  maxAmountPaid: BigDecimal! @aggregate(fn: "max", arg: "amountPaid")

  # Principal metrics
  totalPrincipalPaid: BigDecimal! @aggregate(fn: "sum", arg: "principalPaid")
  minPrincipalPaid: BigDecimal! @aggregate(fn: "min", arg: "principalPaid")
  maxPrincipalPaid: BigDecimal! @aggregate(fn: "max", arg: "principalPaid")

  # Interest metrics
  totalInterestPaid: BigDecimal! @aggregate(fn: "sum", arg: "interestPaid")
  minInterestPaid: BigDecimal! @aggregate(fn: "min", arg: "interestPaid")
  maxInterestPaid: BigDecimal! @aggregate(fn: "max", arg: "interestPaid")
}

"""
Aggregated extension statistics
"""
type ExtensionStats
  @aggregation(intervals: ["hour", "day"], source: "ExtendLoanEvent") {
  id: Int8!
  timestamp: Timestamp!
  clearinghouse: BigInt!
    @aggregate(fn: "count", field: "clearinghouseSnapshot.clearinghouse")

  # Count of extensions
  extensionCount: Int! @aggregate(fn: "count")

  # Interest metrics
  totalNewInterest: BigDecimal! @aggregate(fn: "sum", arg: "interestDue")
  minNewInterest: BigDecimal! @aggregate(fn: "min", arg: "interestDue")
  maxNewInterest: BigDecimal! @aggregate(fn: "max", arg: "interestDue")

  # Period metrics
  totalPeriods: Int! @aggregate(fn: "sum", arg: "periods")
  maxPeriods: Int! @aggregate(fn: "max", arg: "periods")
  minPeriods: Int! @aggregate(fn: "min", arg: "periods")
}

"""
Daily stats for the Clearinghouse
"""
type ClearinghouseSnapshotStats
  @aggregation(intervals: ["hour", "day"], source: "ClearinghouseSnapshot") {
  id: Int8!
  timestamp: Timestamp!
  clearinghouse: Clearinghouse!

  # Receivables
  totalInterestReceivables: BigDecimal!
    @aggregate(fn: "last", arg: "interestReceivables")
  totalPrincipalReceivables: BigDecimal!
    @aggregate(fn: "last", arg: "principalReceivables")

  # Balance metrics
  reserveBalance: BigDecimal! @aggregate(fn: "last", arg: "reserveBalance")
  sReserveBalance: BigDecimal! @aggregate(fn: "last", arg: "sReserveBalance")
  sReserveInReserveBalance: BigDecimal!
    @aggregate(fn: "last", arg: "sReserveInReserveBalance")

  # Treasury balances
  treasuryReserveBalance: BigDecimal!
    @aggregate(fn: "last", arg: "treasuryReserveBalance")
  treasurySReserveBalance: BigDecimal!
    @aggregate(fn: "last", arg: "treasurySReserveBalance")
  treasurySReserveInReserveBalance: BigDecimal!
    @aggregate(fn: "last", arg: "treasurySReserveInReserveBalance")

  # Count of snapshots in period
  snapshotCount: Int! @aggregate(fn: "count")
}
